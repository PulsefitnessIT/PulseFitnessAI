crons:
  - name: sicon-nightly-sync
    description: "Nightly hands-off Sicon read-side sync (equipment + cases) for every org with the integration enabled"
    cron: "0 2 * * *"
    endpoint: "{{BASE_URL}}/api/sicon/cron/nightly-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: ppm-autoschedule
    description: "Daily check that auto-creates due BFPO planned-maintenance services per site on their quarterly/annual cadence"
    cron: "0 6 * * *"
    endpoint: "{{BASE_URL}}/api/bfpo/ppm/cron/autoschedule"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: vehicle-check-remind
    description: "Friday 2pm UK email reminding drivers to finish their outstanding weekly vehicle check"
    cron: "0 14 * * 5"
    timezone: "Europe/London"
    endpoint: "{{BASE_URL}}/api/vehicle-checks/cron/weekly-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: pro-trial-reminder
    description: "Hourly check that emails Lite owners their usage a day before the Pulse Pro trial ends"
    cron: "15 * * * *"
    endpoint: "{{BASE_URL}}/api/me/pro-trial/cron/reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: cm-daily-checks
    description: "Weekday 7am UK checks: contract renewals, missing info, warranty/RPI reminders and MOD quotation chase-ups"
    cron: "0 7 * * 1-5"
    timezone: "Europe/London"
    endpoint: "{{BASE_URL}}/api/crm/workspace/cron/daily-checks"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
