        <link rel="manifest" id="app-manifest" href="%PUBLIC_URL%/manifest.json" />
        <script>
          // Iter 215bx — swap the PWA manifest + apple-touch-icon to the
          // Pulse Fitness brand when the user is on a /pulse route, so
          // "Add to Home Screen" installs with the right icon, name, and
          // theme. Runs synchronously before the SW registers.
          (function () {
            try {
              if (location.pathname.toLowerCase().startsWith('/pulse')) {
                var m = document.getElementById('app-manifest');
                if (m) m.setAttribute('href', '/manifest-pulse.json');
                var t = document.getElementById('apple-app-title');
                if (t) t.setAttribute('content', 'Pulse Fitness');
                var i = document.getElementById('apple-touch-icon');
                if (i) i.setAttribute('href', "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%2366ccff'/><text x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='100' fill='%23212721'>P</text></svg>");
                document.documentElement.setAttribute('data-brand', 'pulse');
                document.body && document.body.setAttribute('data-brand', 'pulse');
              }
            } catch (_) { /* best-effort */ }
          })();
        </script>
