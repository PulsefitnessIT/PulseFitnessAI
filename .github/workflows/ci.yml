name: CI — pre-commit gates + tests

# Run the same gates that block local "Save to GitHub" (.pre-commit-config.yaml)
# on every push and pull request. Catches lint / security / complexity / ESLint
# regressions in CI rather than on the developer's laptop, so the GitHub UI
# shows a green/red badge on every PR and you can require checks to pass
# before merge.
#
# Why duplicate the pre-commit hooks here?
#   - Pre-commit only runs on a developer's machine. CI is the one place where
#     the check is truly mandatory — devs can use --no-verify to skip locally.
#   - The same config (.pre-commit-config.yaml) is invoked here, so there is
#     ONE source of truth for "what counts as broken".
#   - Pull requests will show inline comments on offending lines via
#     reviewdog-style annotations.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new commit arrives on the same branch.
# Saves CI minutes on rapid-fire pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: pre-commit gates (ruff · bandit · eslint · complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for pre-commit's --from-ref/--to-ref

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install backend dev deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Pin to match the local dev environment so behaviour is
          # identical between developer laptop and CI. New majors of
          # ruff/bandit have introduced rule-set changes that broke CI
          # silently in the past.
          pip install \
            ruff==0.15.10 \
            "bandit[toml]==1.9.4" \
            xenon==0.9.3 \
            radon==6.0.1 \
            pre-commit==4.0.1

      - name: Install frontend deps
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile || {
            echo "::warning file=frontend/yarn.lock::yarn.lock is out of date with package.json; installing without --frozen-lockfile. Commit the refreshed lockfile."
            yarn install --non-interactive
          }

      # Each gate runs as a separate step so a CI failure tells you EXACTLY
      # which check broke instead of one giant "pre-commit failed" log.

      - name: Ruff (Python lint)
        run: ruff check backend/

      - name: Bandit (Python security — high severity only)
        # `-lll` filters to HIGH severity; bandit exits 0 if clean, 1 if any
        # high-severity issues found. The previous `--exit-zero-on-skipped`
        # flag never existed in bandit and was failing CI on every push.
        run: bandit -r backend/ -lll

      - name: Xenon (complexity safety-net — repo-wide)
        working-directory: backend
        # Same thresholds as .pre-commit-config.yaml's
        # complexity-gate-repo-safety-net hook.
        run: xenon --max-absolute F --max-modules F --max-average C --exclude "tests/*,venv/*,migrations/*" .

      - name: ESLint (frontend, strict 0-warning gate)
        working-directory: frontend
        # Iter 216h293 — was previously bypassing the gate with a
        # bogus huge max-warnings budget. We've cleared the legacy
        # lint debt and `make lint-frontend` enforces 0 warnings
        # locally — CI must match or developers will quietly
        # regress dark-mode leakage.
        run: yarn eslint --max-warnings 0 src/

      - name: Detect hardcoded secrets
        run: |
          # Cheap grep for the patterns most likely to leak. Bandit catches
          # the rest. Test fixtures legitimately reference these prefixes
          # (e.g. `sk_live_x` as a sentinel in test_secrets_audit_215ae.py),
          # so we exclude `backend/tests/`. Adjust if it produces false
          # positives.
          ! grep -rE "(sk_live_|sk_test_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})" \
              --include="*.py" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" \
              --exclude-dir=tests \
              backend/ frontend/src/ \
              || (echo "::error::Potential secret detected. Move it to .env." && exit 1)

  backend-tests:
    name: Backend regression suite (make regression)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Iter 216h293 — was a single hand-picked test file. Promoted to
    # the curated `make regression` target (511+ unit tests, no live
    # MongoDB, no LLM, runs in ~15 s) so a `--no-verify` commit can't
    # bypass it. The sister `quality-gate.yml` still owns the heavier
    # mongo-backed regression directory + production build smoke.
    # Test modules import the app's database layer, which requires these settings.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: pulse_ci_regression
      JWT_SECRET: ci-only-jwt-secret-${{ github.run_id }}-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_backend.sh
          pip install pytest pytest-asyncio

      - name: Start backend for API-level tests
        # Many regression tests call the HTTP API; run the app locally so they never hit a live environment.
        working-directory: backend
        env:
          JWT_ALGORITHM: HS256
          LOGIN_RATE_LIMIT_MAX: "500"
          LOGIN_RATE_LIMIT_WINDOW: "60"
          RATE_LIMIT_BYPASS_SECRET: ci-bypass-${{ github.run_id }}
          MOD_RATES_ALLOW_SYNTHETIC: "true"
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/api/health >/dev/null && echo "backend up" && exit 0
            sleep 2
          done
          tail -n 80 /tmp/backend.log
          exit 1

      - name: Run regression suite
        env:
          TEST_API_URL: http://127.0.0.1:8001
          RATE_LIMIT_BYPASS_SECRET: ci-bypass-${{ github.run_id }}
        # `make regression` is the developer-facing target everyone
        # runs locally before pushing. CI runs it verbatim so there
        # is exactly ONE definition of "did the suite pass".
        run: make regression

  security-gate:
    name: Zero-Trust authorisation gate (BOLA · BFLA · step-up)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Fails the build if a NEW /api endpoint ships without an auth dependency
    # (Broken Function-Level Authorisation) or if any BOLA / cross-tenant /
    # cross-site / mass-assignment / state-machine / step-up guard regresses.
    # Needs a live Mongo (the authz tests seed + assert against it).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: pulse_ci
      JWT_SECRET: ci-only-jwt-secret-${{ github.run_id }}-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_backend.sh
          pip install pytest pytest-asyncio

      - name: Authorisation matrix + BOLA + step-up regression
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_auth_matrix.py \
            tests/test_security_authz_matrix.py \
            tests/test_step_up.py \
            tests/test_abuse_guard.py \
            -q --tb=short
